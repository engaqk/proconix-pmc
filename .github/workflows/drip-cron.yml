name: Hourly Drip Email Cron

on:
  schedule:
    # Runs every hour at minute 0 (UTC)
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions tab

jobs:
  trigger-drip:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Drip Cron API
        run: |
          echo "Triggering drip cron at $(date)"
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET \
            "https://proconixpmc.com/api/cron/drip" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 30)
          echo "Response status: $response"
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "✓ Drip cron triggered successfully"
          else
            echo "✗ Drip cron failed with status $response"
            exit 1
          fi

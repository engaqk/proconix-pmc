name: Scheduled Email Broadcasts

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  trigger-broadcasts:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scheduled Broadcasts
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            ${{ secrets.PROD_URL }}/api/cron/broadcasts
